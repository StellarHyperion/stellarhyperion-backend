name: testnet-indexer

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/indexer.yml"
      - "src/**"
      - "migrations/**"
      - "deployments/testnet.json"
      - "package*.json"
      - ".npmrc"
      - "hyperion-protocol-0.1.0.tgz"

permissions:
  contents: read

concurrency:
  group: hyperion-testnet-indexer
  cancel-in-progress: false

jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      checks: read
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      # No checkout or contribution-controlled code runs in this job.
      - name: Require successful main CI for this exact commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request
          def get(path):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + os.environ["REPOSITORY"] + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          ready = False
          for check in get("/commits/" + os.environ["COMMIT_SHA"] + "/check-runs?per_page=100")["check_runs"]:
              if check["name"] != "gate" or check["app"]["slug"] != "github-actions" or check["conclusion"] != "success" or check["head_sha"] != os.environ["COMMIT_SHA"]:
                  continue
              run_id = check["check_suite"]["id"]
              # A check suite is not a workflow run: find its associated run and verify its identity.
              runs = get("/actions/runs?head_sha=" + os.environ["COMMIT_SHA"] + "&per_page=100")["workflow_runs"]
              for run in runs:
                  if (run["check_suite_id"] == run_id and run["head_sha"] == os.environ["COMMIT_SHA"]
                      and run["path"] == ".github/workflows/ci.yml"
                      and run["head_branch"] == "main" and run["event"] == "push"
                      and run["head_repository"]["full_name"] == os.environ["REPOSITORY"]):
                      ready = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("ready=" + str(ready).lower() + "\n")
          if not ready:
              print("::notice::This main commit has no successful CI gate yet; the next scheduled run will retry.")
          PYCODE

  build:
    needs: [authorize]
    if: needs.authorize.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Restrict build network access
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # verified upstream v2 snapshot
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          disable-telemetry: true
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            nodejs.org:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
      - name: Install and build without runtime credentials
        run: npm ci --ignore-scripts && npm run build
      - name: Preserve only compiled runtime code
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indexer-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  catch-up:
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # Restrict this environment to main and configure environment review/secret policies in GitHub.
    environment: testnet-indexer
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      HYPERION_NETWORK: testnet
      HYPERION_DEPLOYMENTS_FILE: ./deployments/testnet.json
      INDEXER_ENABLED: "true"
      RAILS_ENABLED: "true"
      KEEPER_ENABLED: "false"
      NODE_ENV: production
      HTTP_HOST: 127.0.0.1
      HTTP_PORT: "8080"
    steps:
      - name: Monitor runtime egress
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # verified upstream v2 snapshot
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
      - name: Install locked production dependencies without hooks or secrets
        run: npm ci --omit=dev --ignore-scripts
      - name: Download this run's compiled code
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indexer-${{ github.sha }}
          path: dist/
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.HYPERION_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm run migrate:up
      - name: Index source events and verify destination payments
        env:
          DATABASE_URL: ${{ secrets.HYPERION_DATABASE_URL }}
        run: timeout --signal=TERM --kill-after=20s 150s node dist/main.js || test "$?" -eq 124
