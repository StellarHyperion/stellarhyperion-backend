name: PR assignment enforcement

on:
  issues:
    types: [assigned, unassigned]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report decisions without closing pull requests
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: pr-assignment-enforcement-${{ github.repository }}
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Restrict network access
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # verified upstream v2 snapshot
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          disable-telemetry: true
          allowed-endpoints: api.github.com:443

      - name: Enforce the trusted default-branch assignment policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLICY_REF: ${{ github.event.repository.default_branch }}
          PR_ASSIGNMENT_HELPER_BOTS: ${{ vars.PR_ASSIGNMENT_HELPER_BOTS }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          # Fetch only maintainer-controlled code from the default branch.
          # Never check out, import, or run a contributor's PR branch.
          path = ".github/scripts/enforce_pr_assignments.py"
          query = urllib.parse.urlencode({"ref": os.environ["POLICY_REF"]})
          request = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
              + "/contents/" + path + "?" + query,
              headers={
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "hyperion-pr-assignment-bootstrap",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              content = json.load(response)
          source = base64.b64decode(content["content"], validate=False)
          exec(compile(source, path, "exec"), {"__name__": "__main__"})
          PY
