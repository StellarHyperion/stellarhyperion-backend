name: Source security

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Restrict analysis network access
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          disable-telemetry: true
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Check out the tested source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize static analysis without executing a project build
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          tools: linked

      - name: Analyze source and write local findings
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          upload: false
          output: source-security-results
          category: source-security/${{ matrix.language }}

      - name: Block high and critical source security findings
        run: python3 -B .github/scripts/check_source_security.py source-security-results

      - name: Retain source security findings for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-security-${{ matrix.language }}
          path: source-security-results/*.sarif
          if-no-files-found: error
          retention-days: 14
