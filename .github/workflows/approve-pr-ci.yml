name: Automatic PR CI

on:
  pull_request_target:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [dev]
  issues:
    types: [assigned]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write
  statuses: write

concurrency:
  group: automatic-pr-ci-${{ github.repository }}-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  authorize:
    name: scan PR safety and authorize assigned contributor CI
    if: github.event_name == 'pull_request_target' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Restrict authorization network access
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # verified upstream v2 snapshot
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          disable-telemetry: true
          allowed-endpoints: api.github.com:443

      - name: Scan and authorize CI with immutable dev policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_REF: ${{ github.event.repository.default_branch }}
          POLICY_SHA: ${{ github.workflow_sha }}
          PR_ASSIGNMENT_HELPER_BOTS: ${{ vars.PR_ASSIGNMENT_HELPER_BOTS }}
        run: |
          python3 -B - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          import types
          import urllib.parse
          import urllib.request

          # No checkout, PR import, artifact download, or contributed code runs here.
          # The policy modules come from the trusted workflow revision, not a PR ref.
          revision = os.environ["POLICY_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise ValueError("Invalid trusted workflow revision")
          for module in ["enforce_pr_assignments", "pr_safety", "approve_pr_ci"]:
              path = ".github/scripts/" + module + ".py"
              query = urllib.parse.urlencode({"ref": revision})
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
                  + "/contents/" + path + "?" + query,
                  headers={
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "hyperion-pr-ci-bootstrap",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  content = json.load(response)
              if content.get("type") != "file" or content.get("encoding") != "base64":
                  raise ValueError("Trusted policy module unavailable")
              source = base64.b64decode(content["content"])
              loaded = types.ModuleType(module)
              sys.modules[module] = loaded
              exec(compile(source, path, "exec"), loaded.__dict__)
          sys.exit(sys.modules["approve_pr_ci"].main())
          PY
