name: ci

on:
  pull_request:
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hyperion
          POSTGRES_PASSWORD: hyperion-local-only
          POSTGRES_DB: hyperion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Check out contracts repository for protocol dependency
        uses: actions/checkout@v4
        with:
          repository: StellarHyperion/stellarhyperion-contracts
          path: contracts

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            contracts/packages/protocol/package-lock.json
            backend/package-lock.json

      - name: Build protocol package
        working-directory: contracts/packages/protocol
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check formatting
        working-directory: backend
        run: npm run fmt:check

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Build distribution
        working-directory: backend
        run: npm run build

      - name: Run database migrations against test database
        working-directory: backend
        env:
          DATABASE_URL: postgres://hyperion:hyperion-local-only@localhost:5432/hyperion_test
        run: npm run migrate:up

      - name: Run unit and integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://hyperion:hyperion-local-only@localhost:5432/hyperion_test
          REDIS_URL: redis://localhost:6379
        run: npm test

  deploy-preview:
    name: vercel preview deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - backend
    if: (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') || (github.event_name == 'pull_request' && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.user.login == 'dotmantissa'))
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Check out contracts repository for protocol dependency
        uses: actions/checkout@v4
        with:
          repository: StellarHyperion/stellarhyperion-contracts
          path: contracts

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            contracts/packages/protocol/package-lock.json
            backend/package-lock.json

      - name: Build protocol package
        working-directory: contracts/packages/protocol
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Pull Vercel preview environment
        working-directory: backend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        working-directory: backend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Preview
        id: deploy
        working-directory: backend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOYMENT_URL=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Vercel Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "URL: $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: vercel production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://stellarhyperion-backend.vercel.app
    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Check out contracts repository for protocol dependency
        uses: actions/checkout@v4
        with:
          repository: StellarHyperion/stellarhyperion-contracts
          path: contracts

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            contracts/packages/protocol/package-lock.json
            backend/package-lock.json

      - name: Build protocol package
        working-directory: contracts/packages/protocol
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Pull Vercel production environment
        working-directory: backend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel (Production)
        working-directory: backend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        id: deploy
        working-directory: backend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOYMENT_URL=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Vercel Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "URL: $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY

  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - backend
      - deploy-preview
      - deploy-production
    if: always()

    steps:
      - name: Verify all required checks passed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          PREVIEW_RESULT: ${{ needs.deploy-preview.result }}
          PROD_RESULT: ${{ needs.deploy-production.result }}
        run: |
          if [ "$BACKEND_RESULT" != "success" ]; then
            echo "Backend CI failed with status: $BACKEND_RESULT"
            exit 1
          fi
          if [ "$PREVIEW_RESULT" == "failure" ] || [ "$PREVIEW_RESULT" == "cancelled" ]; then
            echo "Vercel preview deployment failed with status: $PREVIEW_RESULT"
            exit 1
          fi
          if [ "$PROD_RESULT" == "failure" ] || [ "$PROD_RESULT" == "cancelled" ]; then
            echo "Vercel production deployment failed with status: $PROD_RESULT"
            exit 1
          fi
          echo "All backend CI checks and deployments passed successfully."
