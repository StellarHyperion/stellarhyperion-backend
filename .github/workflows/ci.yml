name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  HYPERION_LIVE_ROUTES: "0"
  HYPERION_LIVE_TESTNET: "0"

jobs:
  supply-chain:
    uses: ./.github/workflows/supply-chain.yml

  backend:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hyperion
          POSTGRES_PASSWORD: hyperion-local-only
          POSTGRES_DB: hyperion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Restrict build network access
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # verified upstream v2 snapshot
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          disable-telemetry: true
          allowed-endpoints: |
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443

      - name: Check out backend repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1

      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build distribution
        run: npm run build

      - name: Run database migrations against test database
        env:
          DATABASE_URL: postgres://hyperion:hyperion-local-only@localhost:5432/hyperion_test
        run: npm run migrate:up

      - name: Run unit and integration tests
        env:
          TEST_DATABASE_URL: postgres://hyperion:hyperion-local-only@localhost:5432/hyperion_test
          REDIS_URL: redis://localhost:6379
        run: npm test

  # Vercel's installed Git integration deploys main and reports its own deployment status.
  # Keep deployment credentials out of Actions and avoid duplicate production deployments.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [backend, supply-chain]
    steps:
      - name: Require successful checks
        env:
          CHECK_RESULT: ${{ needs.backend.result }}
          SECURITY_RESULT: ${{ needs.supply-chain.result }}
        run: test "$CHECK_RESULT" = success && test "$SECURITY_RESULT" = success
