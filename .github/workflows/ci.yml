name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  HYPERION_LIVE_ROUTES: "0"
  HYPERION_LIVE_TESTNET: "0"

jobs:
  supply-chain:
    uses: ./.github/workflows/supply-chain.yml

  backend:
    name: lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # A private, runner-owned cluster needs neither sudo nor Docker after isolation starts.
      # Redis interactions are mocked by the current tests; no Redis service is required.
      - name: Prepare isolated PostgreSQL test database
        run: |
          set -euo pipefail
          pg_bin=/usr/lib/postgresql/16/bin
          pg_data="$RUNNER_TEMP/hyperion-postgres"
          mkdir -m 700 "$RUNNER_TEMP/hyperion-postgres-socket"
          "$pg_bin/initdb" --pgdata="$pg_data" --username=hyperion --auth=trust --no-locale
          "$pg_bin/pg_ctl" --pgdata="$pg_data" --log="$RUNNER_TEMP/hyperion-postgres.log" \
            --options="-h 127.0.0.1 -p 5432 -k $RUNNER_TEMP/hyperion-postgres-socket" --wait start
          "$pg_bin/createdb" --host=127.0.0.1 --username=hyperion hyperion_test

      - name: Restrict build network access
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # verified upstream v2 snapshot
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          disable-telemetry: true
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443

      - name: Check out backend repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1

      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build distribution
        run: npm run build

      - name: Run database migrations against test database
        env:
          DATABASE_URL: postgres://hyperion:hyperion-local-only@localhost:5432/hyperion_test
        run: npm run migrate:up

      - name: Run unit and integration tests
        env:
          TEST_DATABASE_URL: postgres://hyperion:hyperion-local-only@localhost:5432/hyperion_test
          REDIS_URL: redis://localhost:6379
        run: npm test

      - name: Stop isolated PostgreSQL
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hyperion-postgres/postmaster.pid" ]; then
            /usr/lib/postgresql/16/bin/pg_ctl --pgdata="$RUNNER_TEMP/hyperion-postgres" --mode=fast --wait stop
          fi

  # Vercel's installed Git integration deploys main and reports its own deployment status.
  # Keep deployment credentials out of Actions and avoid duplicate production deployments.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [backend, supply-chain]
    steps:
      - name: Require successful checks
        env:
          CHECK_RESULT: ${{ needs.backend.result }}
          SECURITY_RESULT: ${{ needs.supply-chain.result }}
        run: test "$CHECK_RESULT" = success && test "$SECURITY_RESULT" = success
