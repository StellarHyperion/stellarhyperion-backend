name: Bug report
description: Report an issue in the watchers, pollers, keeper jobs, or REST API.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        If this issue poses a security risk or could lead to unauthorized actions or financial loss,
        please submit a private report at [GitHub Security Advisories](https://github.com/StellarHyperion/stellarhyperion-backend/security/advisories/new) instead.

  - type: dropdown
    id: area
    attributes:
      label: Subsystem
      description: Choose the component where the issue occurs.
      options:
        - Stellar event watcher (src/chains/stellar)
        - EVM event watcher (src/chains/evm)
        - Circle CCTP Iris poller (src/rails/cctp)
        - Axelar GMP poller (src/rails/axelar)
        - BullMQ keeper upkeep (src/keeper)
        - REST API (src/http)
        - Database schema or migrations (src/db, migrations)
        - Configuration and runtime supervision (src/config, src/runtime)
        - Other
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit revision
      description: Provide the specific commit hash or release tag.
      placeholder: "e.g. 3655949"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the bug
      description: Explain what happened versus what was expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide clear reproduction steps, test cases, or API queries.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Include any relevant pino log output or error stack traces.
      render: shell
